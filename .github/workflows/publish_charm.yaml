name: Publish Charm

on:
  push:
    branches:
      - main
      - track/*
    # Keep in sync with extra-ignored-file-patterns in integration_test.yaml:
    # integration tests skip these changes, so there is no build to publish.
    paths-ignore:
      - apm.yml
      - apm.lock.yaml
      - .agents/**
      - .github/agents/**
      - .github/instructions/**

jobs:
  publish:
    # The workflow automatically detects which branch triggered it.
    # If called from a merge on `main`, the charm is pushed to the `latest/edge` channel.
    # If merged on a `track/X` branch, the revision is pushed to `X/edge` on Charmhub.
    uses: canonical/operator-workflows/.github/workflows/publish_charm.yaml@main
    secrets: inherit
    permissions:
      contents: write
