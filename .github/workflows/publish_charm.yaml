name: Publish Charm

on:
  push:
    branches:
      - main
      - track/*
    paths-ignore:
      # Integration tests skip the build when only these files change, so
      # there is nothing to publish. Keep in sync with integration_test.yaml.
      # operator-workflows' integration tests ignore these by default:
      - "**.md"
      - "**.rst"
      - "**.custom_wordlist.txt"
      - LICENSE
      # extra-ignored-file-patterns in integration_test.yaml:
      - apm.yml
      - apm.lock.yaml
      - .agents/**
      - .github/agents/**
      - .github/instructions/**

jobs:
  publish:
    # The workflow automatically detects which branch triggered it.
    # If called from a merge on `main`, the charm is pushed to the `latest/edge` channel.
    # If merged on a `track/X` branch, the revision is pushed to `X/edge` on Charmhub.
    uses: canonical/operator-workflows/.github/workflows/publish_charm.yaml@main
    secrets: inherit
    permissions:
      contents: write
