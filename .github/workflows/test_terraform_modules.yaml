name: Terraform module tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/test_terraform_modules.yaml"

jobs:
  terraform-charm:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_test.yaml@main
    secrets: inherit
    permissions:
      contents: read
    with:
      k8s-controller: true
      terraform-directories: '["terraform/charm"]'

  terraform-product:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_test.yaml@main
    secrets: inherit
    permissions:
      contents: read
    with:
      k8s-controller: true
      terraform-directories: '["terraform/product"]'
      # Traefik waits for its LoadBalancer service to get an address, so give the cluster a pool.
      additional-setup-script: |
        IPADDR=$(ip -4 -j route get 2.2.2.2 | jq -r '.[] | .prefsrc')
        sudo k8s set load-balancer.cidrs="${IPADDR%.*}.100-${IPADDR%.*}.255" load-balancer.enabled=true load-balancer.l2-mode=true
