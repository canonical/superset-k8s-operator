[tox]
envlist = fmt, lint, unit, static, coverage-report
no_package = True
skip_missing_interpreters = True
max-line-length=120

[vars]
src_path = {toxinidir}/src/
tst_path = {toxinidir}/tests/
all_path = {[vars]src_path} {[vars]tst_path}

[testenv]
runner = uv-venv-runner
setenv =
  PYTHONPATH = {toxinidir}:{toxinidir}/lib:{[vars]src_path}
  PYTHONBREAKPOINT=ipdb.set_trace
  PY_COLORS=1
passenv =
  PYTHONPATH
  CHARM_BUILD_DIR
  MODEL_SETTINGS

[testenv:integration]
description = Run integration tests
runner = uv-venv-lock-runner
passenv =
    CHARM_PATH
dependency_groups = integration
commands =
    pytest {[vars]tst_path}integration -v --tb native --log-cli-level=INFO -s {posargs}

[testenv:integration-deployment]
description = Run the deployment scenarios
runner = uv-venv-lock-runner
dependency_groups = integration
commands =
    pytest {[vars]tst_path}integration/test_deployment.py -v --tb native --log-cli-level=INFO -s {posargs}

[testenv:integration-lifecycle]
description = Run the lifecycle scenarios
runner = uv-venv-lock-runner
dependency_groups = integration
commands =
    pytest {[vars]tst_path}integration/test_lifecycle.py -v --tb native --log-cli-level=INFO -s {posargs}

[testenv:integration-scaling]
description = Run the scaling scenarios
runner = uv-venv-lock-runner
dependency_groups = integration
commands =
    pytest {[vars]tst_path}integration/test_scaling.py -v --tb native --log-cli-level=INFO -s {posargs}

[testenv:integration-relation-order]
description = Run the relation order scenarios
runner = uv-venv-lock-runner
dependency_groups = integration
commands =
    pytest {[vars]tst_path}integration/test_relation_order.py -v --tb native --log-cli-level=INFO -s {posargs}

[testenv:integration-upgrades]
description = Run the upgrade scenarios
runner = uv-venv-lock-runner
dependency_groups = integration
commands =
    pytest {[vars]tst_path}integration/test_upgrades.py -v --tb native --log-cli-level=INFO -s {posargs}

[testenv:integration-oauth]
description = Run the OAuth relation scenarios
runner = uv-venv-lock-runner
dependency_groups = integration
commands =
    pytest {[vars]tst_path}integration/test_oauth.py -v --tb native --log-cli-level=INFO -s {posargs}

[testenv:integration-smtp]
description = Run the SMTP relation scenarios
runner = uv-venv-lock-runner
dependency_groups = integration
commands =
    pytest {[vars]tst_path}integration/test_smtp.py -v --tb native --log-cli-level=INFO -s {posargs}

[testenv:integration-reports]
description = Run the alert and report scenarios
runner = uv-venv-lock-runner
dependency_groups = integration
commands =
    pytest {[vars]tst_path}integration/test_reports.py -v --tb native --log-cli-level=INFO -s {posargs}

[testenv:integration-trino-catalog]
description = Run the Trino catalog relation scenarios
runner = uv-venv-lock-runner
dependency_groups = integration
commands =
    pytest {[vars]tst_path}integration/test_trino_catalog.py -v --tb native --log-cli-level=INFO -s {posargs}

[testenv:integration-observability]
description = Run the observability scenarios
runner = uv-venv-lock-runner
dependency_groups = integration
commands =
    pytest {[vars]tst_path}integration/test_observability.py -v --tb native --log-cli-level=INFO -s {posargs}

[testenv:unit]
description = Run tests
deps =
    -r pyproject.toml
dependency_groups =
    unit
    charmlibs-pydeps
commands =
    coverage run --source={[vars]src_path} \
        -m pytest --ignore={[vars]tst_path}integration -v --tb native -s {posargs}
    coverage report

[testenv:coverage-report]
description = Create test coverage report
deps =
    -r pyproject.toml
dependency_groups =
    unit
    charmlibs-pydeps
commands =
    coverage report

[testenv:static]
description = Run static analysis tests
deps =
    -r pyproject.toml
dependency_groups =
    static
    charmlibs-pydeps
commands =
    bandit -c {toxinidir}/pyproject.toml -r {[vars]src_path} {[vars]tst_path}

[testenv:fmt]
description = Format the code
dependency_groups = lint
commands =
    isort {[vars]src_path} {[vars]tst_path}
    black {[vars]src_path} {[vars]tst_path}

[testenv:lint]
description = Lint the code
deps =
    -r pyproject.toml
dependency_groups =
    lint
    charmlibs-pydeps
commands =
    pydocstyle {[vars]src_path}
    codespell {toxinidir} --skip {toxinidir}/.git --skip {toxinidir}/.tox --ignore-words-list "ro" \
      --skip {toxinidir}/build --skip {toxinidir}/lib --skip {toxinidir}/venv \
      --skip {toxinidir}/.mypy_cache --skip {toxinidir}/icon.svg
    pflake8 {[vars]src_path} {[vars]tst_path}
    isort --check-only --diff {[vars]src_path} {[vars]tst_path}
    black --line-length 79 --check --diff {[vars]src_path} {[vars]tst_path}
    mypy {[vars]src_path} {[vars]tst_path}conftest.py {[vars]tst_path}unit/ \
      --ignore-missing-imports --follow-imports=skip --install-types --non-interactive
    mypy {[vars]tst_path}integration/ \
      --ignore-missing-imports --follow-imports=skip --install-types --non-interactive
    pylint {[vars]src_path} --disable=E0401,W1203,W0613,W0718,R0903,W1514,C0103,R0913,C0301,W0212,R0902,C0104,E1121,R0801,E1120
    pylint {[vars]tst_path} --disable=E0401,W1203,W0613,W0718,R0903,W1514,C0103,R0913,C0301,W0212,R0902,C0104,E1121,R0801,E1120,W0621,C0302
