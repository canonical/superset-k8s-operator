# This file defines charm config options, and populates the Configure tab on Charmhub.
# If your charm does not require configuration options, delete this file entirely.
#
# See https://juju.is/docs/config for guidance.

options:
  allow-image-domains: 
    description: |
        Comma separated list of domains from which to allow images according to the CSP.
    type: string
  superset-secret-key:
    description: |
        Your App secret key will be used for securely signing the session cookie
        and encrypting sensitive information on the database. This secret is required.
    type: string
  admin-password:
    description: |
        The secret for the admin account created on app initialisation. Default is 'admin'.
    default: admin
    type: string
  charm-function:
    description: |
        The type of superset function you want the charm to fulfill.
        Allowed options are: 'app-gunicorn', 'app', 'worker', 'beat'
    default: app-gunicorn
    type: string
  sqlalchemy-pool-size:
    description: |
        Specifies the maximum number of database connections
        that can be kept in the connection pool.
    default: 5
    type: int
  sqlalchemy-pool-timeout:
    description: |
        Defines the maximum time (in seconds) a thread is allowed
        to wait for a connection from the pool.
    default: 300
    type: int
  sqlalchemy-max-overflow:
    description: |
        Sets the maximum number of connections that can be created
        beyond the pool size when the pool is exhausted.
    default: 5
    type: int
  oauth-admin-email:
    description: |
      Email(s) to be given an Admin role on initialization.
      Either a single email or a comma separated list.
      eg. "example.email@company.com, example.email2@company.com"
    type: string
    default: admin@superset.com
  self-registration-role:
    description: |
      The default role to be provided to users that self-register via OAuth.
      This role must exist already in Superset and is case sensitive.
    type: string
    default: Public
  load-examples:
    description: |
      Loads example data source with corresponding data sets and charts for testing.
    type: boolean
    default: False
  html-sanitization:
    description: |
      Sanitizes the HTML content used in markdowns to allow its rendering in a safe manner.
      Disabling this option is not recommended for security reasons
    type: boolean
    default: True
  html-sanitization-schema-extensions:
    description: |
      Use this configuration to extend the HTML sanitization schema.
    type: string
  feature-flags:
    description: |
       A comma-separated list of feature defined in https://github.com/apache/superset/blob/HEAD/RESOURCES/FEATURE_FLAGS.md.
       To disable features enabled by default, precede them with a ! symbol. E.g: ENABLED_FEATURE,!DISABLED_FEATURE.
    type: string
  global-async-queries-jwt:
    description: |
      jwt for communication with redis database for async querying
    type: string
    default: "18b2f8fcd0d708d270c00508da6e8dfc7a21eff14ea438056809805150439a04"
  global-async-queries-polling-delay:
    description: |
      The timedelay in milliseconds for polling during asynchronous query execution.
    type: int
    default: 500
  sentry-dsn:
    description: |
      The unique key for the Sentry project in which to log exceptions.
    type: string
  sentry-environment:
    description: |
      The environment to log errors to in Sentry.
    type: string
  sentry-release:
    description: |
      The version of code deployed to an environment.
    type: string
  sentry-sample-rate:
    description: |
      A number between 0 and 1 representing what % of errors should be sent to Sentry.
      ie for 0.25, 25% of errors will be sent to Sentry.
    default: "1"
    type: string
  sentry-redact-params:
    description: Indicates whether or not event parameters sent to Sentry should be redacted.
    default: false
    type: boolean
  server-alias:
    description: The alias the server charm has been deployed with if it differs from the default.
    default: superset-k8s
    type: string
  webserver-timeout:
    description: The time in seconds the server can maintain a database connection.
    default: 180
    type: int
  screenshot-timeout:
    description: Maximum time in seconds to wait for report and alert screenshots to render.
    default: 600
    type: int
  report-dry-run:
    description: >
      When true, render alert and report screenshots but do not deliver email or Slack
      notifications. Intended for testing the rendering pipeline; leave false in production.
    default: false
    type: boolean
  server-worker-amount:
    description: "Number of Gunicorn worker processes per UI pod. Valid range: 1-32."
    default: 1
    type: int
  gunicorn-timeout:
    description: "Gunicorn worker timeout in seconds. Valid range: 30-600."
    default: 60
    type: int
  celery-worker-concurrency:
    description: "Number of concurrent Celery worker processes per worker pod. Valid range: 0-128."
    default: 0
    type: int
  cache-warmup:
    description: Boolean representing if the cache warm-up functionality should be enabled.
    default: False
    type: boolean
  redis-timeout:
    description: The time in seconds cached data will remain valid in Redis.
    default: 300
    type: int
  log-retention-enabled:
    description: |
      Whether to automatically prune old rows from the `logs` table (user action
      audit log) via the daily `prune_logs` Celery beat task. Disable if you don't
      want the `logs` table pruned at all.
    default: true
    type: boolean
  log-retention-days:
    description: |
      Number of days to retain rows in the `logs` table (user action audit log)
      before they are pruned by the daily `prune_logs` Celery beat task.
      Only takes effect if `log-retention-enabled` is true.
    default: 730
    type: int
  smtp-secret-id:
    description: ID of the Juju secret for the SMTP credentials used to send emails.
    type: string
  dashboard-size-limit:
    description: Integer representing how many characters to allow in a dashboard definition.
    default: 65535
    type: int
  max-content-length:
    description: Werkzeug limit for the number of bytes to allow in a request body as measured by the 'Content-Length' header.
    type: int
  max-form-memory-size:
    description: Werkzeug limit for the number of bytes to allow in a single part of a multipart form.
    type: int
  max-form-parts:
    description: Werkzeug limit for the number of parts to allow in a multipart form.
    type: int
  data-access-request-url:
    description: |
      URL users are directed to when they hit a Trino/Ranger permission-denied error
      while viewing a dashboard, so they can request access to the restricted data.
      When unset, the message tells users to contact their administrator instead.
    type: string
  enable-raise-for-access-patch:
    description: |
      Enables the Superset 6.1.0 SQL Lab-to-chart access workaround. This changes
      Superset's upstream access authorization behavior and is disabled by default.
    default: false
    type: boolean
  mcp-enabled:
    description: |
      When true, starts the Superset MCP server as a separate Pebble service
      (superset mcp run) on mcp-port. Only takes effect when charm-function is
      'app' or 'app-gunicorn'.
    type: boolean
    default: false
  mcp-port:
    description: Port the MCP server listens on.
    type: int
    default: 5008
  mcp-auth-enabled:
    description: |
      When false, the MCP server runs without JWT authentication (dev/internal
      mode only). When true (default), authentication must be configured
      separately. Disable only in trusted environments.
    type: boolean
    default: true
