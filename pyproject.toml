[project]
name = "superset-k8s-operator"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "ops>=3.7,<4",
    "pydantic>=1.10,<2",
    "sqlalchemy<2.0",
    "psycopg2-binary>=2.9,<3",
    "requests>=2.32,<3",
    "pyjwt>=2.11,<3",
    "cryptography>=43.0.0",
]

[dependency-groups]
# Dependencies needed by vendored charm libraries at build time.
charmlibs-pydeps = [
    "ops>=3.7,<4",
    "pydantic>=1.10,<2",
    "jsonschema>=4.26,<5",
    "cosl>=0.0.53",
    "cryptography>=43.0.0",
]

# Dependencies for formatting and linting
lint = [
    "black==26.3.1",
    "codespell==2.2.1",
    "flake8==7.0.0",
    "flake8-builtins==3.0.0",
    "flake8-copyright==0.2.4",
    "flake8-docstrings==1.7.0",
    "flake8-docstrings-complete>=1.0.3",
    "flake8-test-docs>=1.0",
    "isort==5.10.1",
    "mypy",
    "pep8-naming==0.13.2",
    "pydocstyle",
    "pylint",
    "pyproject-flake8==7.0.0",
    "pytest",
]

# Dependencies for static analysis / security
static = [
    "bandit[toml]",
]

# Dependencies for unit tests
unit = [
    "coverage[toml]==6.4.4",
    "ipdb==0.13.9",
    "ops[testing]>=3.7,<4",
    "psycopg2-binary==2.9.9",
    "pytest==9.0.3",
    "sqlglot>=28.10.0,<29",
]

# Dependencies for integration tests
integration = [
    "celery==5.3.6",
    "ipdb==0.13.9",
    "juju==3.5.2.1",
    # pulled in by juju. earlier releases ship protobuf stubs generated by
    # protoc < 3.19, which protobuf 5.x refuses to load at import time.
    "macaroonbakery>=1.3.4",
    "protobuf==5.29.6",
    "pytest==9.0.3",
    "pytest-asyncio==0.21",
    "pytest-operator==0.29.0",
    "redis==5.2.1",
]

# Testing tools configuration
[tool.bandit]
exclude_dirs = ["/venv/"]
[tool.bandit.assert_used]
skips = ["*/*test.py", "*/test_*.py", "*tests/*.py"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
line_length = 79

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

# Formatting tools configuration
[tool.black]
line-length = 79
target-version = ["py38"]

# Linting tools configuration
[tool.ruff]
line-length = 79
select = ["E", "W", "F", "C", "N", "D", "I001"]
extend-ignore = [
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
ignore = ["E501", "D107"]
extend-exclude = ["__pycache__", "*.egg_info"]
per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104"]}

[tool.ruff.mccabe]
max-complexity = 10

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage"

# Linting tools configuration
[tool.flake8]
max-line-length = 79
max-doc-length = 99
max-complexity = 10
exclude = [".git", "__pycache__", ".tox", "build", "dist", "*.egg_info", "venv"]
select = ["E", "W", "F", "C", "N", "R", "D", "H"]
# Ignore W503, E501 because using black creates errors with this
# Ignore D107 Missing docstring in __init__
ignore = ["W503", "E501", "D107"]
# D100, D101, D102, D103: Ignore missing docstrings in tests
# DCO060: Ignore missing attributes in class docstring
per-file-ignores = ["tests/*:D100,D101,D102,D103,D104", "src/structured_config.py:DCO060"]
docstring-convention = "google"
# Check for properly formatted copyright header in each file
copyright-check = "True"
copyright-author = "Canonical Ltd."
copyright-regexp = "Copyright\\s\\d{4}([-,]\\d{4})*\\s+%(author)s"
